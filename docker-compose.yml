services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nomadic_traveler
      POSTGRES_USER: nomadic
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: nomadic_traveler
      DB_USERNAME: nomadic
      DB_PASSWORD: change-me
    depends_on: [db]
    ports: ["8000:8000"]
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
